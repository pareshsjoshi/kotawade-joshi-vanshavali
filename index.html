    <title>जोशी वंशावळी</title>
    <style>
      /* Critical colours also cover the interval before application styles load. */
      html {
        background: #f7f4ed;
        color-scheme: light;
      }
      html[data-theme='dark'] {
        background: #1c1917;
        color-scheme: dark;
      }
    </style>
    <script>
      // Match the saved/device theme before the page paints, even on slow connections.
      (() => {
        let preference;
        try {
          preference = localStorage.getItem('genealogy-theme');
        } catch {}
        const theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#1c1917' : '#f7f4ed');
      })();
    </script>
